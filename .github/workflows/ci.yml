name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    name: Build, Test & Docker Image
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: payment-service
      DOCKER_REGISTRY: ghcr.io
      DOCKER_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Tests
        run: mvn test


      - name: Code Analysis (Optional)
        if: true
        run: |
          echo "Code analysis step placeholder"

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE_NAME:$DOCKER_TAG .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag $DOCKER_IMAGE_NAME:$DOCKER_TAG $DOCKER_REGISTRY/${{ github.repository }}/$DOCKER_IMAGE_NAME:$DOCKER_TAG
          docker push $DOCKER_REGISTRY/${{ github.repository }}/$DOCKER_IMAGE_NAME:$DOCKER_TAG